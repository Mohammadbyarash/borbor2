<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فراموشی رمز عبور - مدرسه بوربور</title>
    
    <!-- Font Awesome -->
      <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../Vazirmatn-font-face.css">
        <link rel="icon" href="../image/iconB.png" />

    
    <style>
        @font-face {
            font-family: "Vazirmatn";
            src: url("../font/Vazirmatn-Medium.woff2") format("woff2");
            font-weight: 500;
        }
        @font-face {
            font-family: "Vazirmatn";
            src: url("../font/Vazirmatn-Regular.woff2") format("woff2");
            font-weight: 400;
        }
        @font-face {
            font-family: "Shabnam";
            src: url("../font/Shabnam-Bold.woff2") format("woff2");
            font-weight: 700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Vazirmatn", sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #202b59 50%, #172047 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .icon-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
            box-shadow: 0 10px 30px rgba(230, 126, 34, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(230, 126, 34, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 40px rgba(230, 126, 34, 0.6);
            }
        }

        .title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            font-family: "Shabnam", sans-serif;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            line-height: 1.7;
        }

        /* Alert Messages */
        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: flex;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.4);
            color: #e74c3c;
        }

        .alert i {
            font-size: 20px;
        }

        /* Form */
        .forgot-form {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: #e67e22;
            font-size: 16px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px 20px;
            padding-right: 50px;
            border-radius: 12px;
            font-size: 16px;
            font-family: "Vazirmatn", sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: #e67e22;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.2);
        }

        .form-input.error {
            border-color: #e74c3c;
            animation: shake 0.4s ease;
        }

        .form-input.success {
            border-color: #10b981;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .input-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #e67e22;
            font-size: 18px;
            pointer-events: none;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            animation: fadeInDown 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-message {
            color: #10b981;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            animation: fadeInDown 0.3s ease;
        }

        .success-message.show {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-family: "Vazirmatn", sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(90deg, #e67e22, #d35400);
            color: white;
            box-shadow: 0 5px 20px rgba(230, 126, 34, 0.4);
            margin-top: 30px;
        }

        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(90deg, #d35400, #ba4a00);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(230, 126, 34, 0.6);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-submit i {
            font-size: 20px;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Back Link */
        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        /* Info Box */
        .info-box {
            background: rgba(52, 152, 219, 0.1);
            border: 1px solid rgba(52, 152, 219, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .info-box i {
            color: #3498db;
            font-size: 20px;
            margin-top: 2px;
        }

        .info-box-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            line-height: 1.7;
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 40px 25px;
            }

            .title {
                font-size: 24px;
            }

            .icon-wrapper {
                width: 80px;
                height: 80px;
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Particles -->
    <div class="particle" style="width: 80px; height: 80px; left: 10%; animation-duration: 15s; animation-delay: 0s;"></div>
    <div class="particle" style="width: 60px; height: 60px; left: 80%; animation-duration: 12s; animation-delay: 2s;"></div>
    <div class="particle" style="width: 40px; height: 40px; left: 50%; animation-duration: 18s; animation-delay: 4s;"></div>
    <div class="particle" style="width: 50px; height: 50px; left: 30%; animation-duration: 20s; animation-delay: 1s;"></div>
    <div class="particle" style="width: 70px; height: 70px; left: 70%; animation-duration: 16s; animation-delay: 3s;"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon-wrapper">
                <i class="fas fa-unlock-alt"></i>
            </div>
            <h1 class="title">فراموشی رمز عبور</h1>
            <p class="subtitle">
                برای بازیابی رمز عبور، شماره موبایل خود را وارد کنید
            </p>
        </div>

        <!-- Info Box -->
        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <div class="info-box-text">
                کد تایید به شماره موبایل ثبت شده شما ارسال خواهد شد
            </div>
        </div>

        <!-- Alert Messages -->
        <div class="alert alert-error" id="alertError">
            <i class="fas fa-exclamation-circle"></i>
            <span id="alertErrorText"></span>
        </div>

        <div class="alert alert-success" id="alertSuccess">
            <i class="fas fa-check-circle"></i>
            <span id="alertSuccessText"></span>
        </div>

        <!-- Forgot Password Form -->
        <form class="forgot-form" id="forgotForm">
            <!-- شماره موبایل -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-mobile-alt"></i>
                    شماره موبایل
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-mobile-alt input-icon"></i>
                    <input 
                        type="tel" 
                        class="form-input" 
                        id="phoneNumber" 
                        placeholder="09xxxxxxxxx"
                        maxlength="11"
                        inputmode="numeric"
                    >
                </div>
                <div class="error-message" id="phoneNumberError"></div>
                <div class="success-message" id="phoneNumberSuccess">
                    <i class="fas fa-check"></i>
                    <span>شماره موبایل صحیح است</span>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <div class="spinner"></div>
                <span class="btn-text">
                    <i class="fas fa-paper-plane"></i>
                    ارسال کد تایید
                </span>
            </button>
        </form>

        <!-- Back Link -->
        <div class="back-link">
            <a href="login.html">
                <i class="fas fa-arrow-right"></i>
                بازگشت به صفحه ورود
            </a>
        </div>
    </div>

    <script>
        // Utility Functions
        const faToEn = (str) => {
            return typeof str === 'string' 
                ? str.replace(/[۰-۹]/g, w => ({
                    '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4',
                    '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9'
                })[w])
                : '';
        };

        // Elements
        const phoneNumberInput = document.getElementById('phoneNumber');
        const forgotForm = document.getElementById('forgotForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertError = document.getElementById('alertError');
        const alertSuccess = document.getElementById('alertSuccess');

        // Convert Persian numbers to English
        phoneNumberInput.addEventListener('input', (e) => {
            let val = faToEn(e.target.value);
            e.target.value = val.replace(/[^0-9]/g, '');
        });

        // Real-time Validation
        phoneNumberInput.addEventListener('blur', () => validatePhoneNumber());

        // Validation Function
        function validatePhoneNumber() {
            const value = phoneNumberInput.value.trim();
            const errorDiv = document.getElementById('phoneNumberError');
            const successDiv = document.getElementById('phoneNumberSuccess');

            if (!value) {
                showError(phoneNumberInput, errorDiv, successDiv, 'لطفاً شماره موبایل را وارد کنید');
                return false;
            }

            if (!value.startsWith('09')) {
                showError(phoneNumberInput, errorDiv, successDiv, 'شماره موبایل باید با ۰۹ شروع شود');
                return false;
            }

            if (value.length !== 11) {
                showError(phoneNumberInput, errorDiv, successDiv, 'شماره موبایل باید ۱۱ رقم باشد');
                return false;
            }

            if (!/^09\d{9}$/.test(value)) {
                showError(phoneNumberInput, errorDiv, successDiv, 'شماره موبایل معتبر نیست');
                return false;
            }

            showSuccess(phoneNumberInput, errorDiv, successDiv);
            return true;
        }

        function showError(input, errorDiv, successDiv, message) {
            input.classList.add('error');
            input.classList.remove('success');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            successDiv.classList.remove('show');
        }

        function showSuccess(input, errorDiv, successDiv) {
            input.classList.remove('error');
            input.classList.add('success');
            errorDiv.classList.remove('show');
            successDiv.classList.add('show');
        }

        function showAlert(type, message) {
            const alert = type === 'success' ? alertSuccess : alertError;
            const text = type === 'success' ? document.getElementById('alertSuccessText') : document.getElementById('alertErrorText');
            
            alertSuccess.classList.remove('show');
            alertError.classList.remove('show');
            
            text.textContent = message;
            alert.classList.add('show');

            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // Form Submit
        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate phone number
            if (!validatePhoneNumber()) {
                showAlert('error', 'لطفاً شماره موبایل را به درستی وارد کنید');
                return;
            }

            // Show loading
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                const phoneNumber = phoneNumberInput.value.trim();

                console.log('Forgot Password Request:', { phoneNumber });

                // Simulate successful request
                showAlert('success', 'کد تایید با موفقیت ارسال شد! در حال انتقال...');

                // Save phone for next page
                localStorage.setItem('resetPhone', phoneNumber);

                // Redirect to reset password page after 2 seconds
                setTimeout(() => {
                    window.location.href = `reset-password.html?phone=${phoneNumber}`;
                }, 2000);

            }, 1500);
        });
    </script>
</body>
</html>
