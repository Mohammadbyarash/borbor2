<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازیابی رمز عبور - مدرسه بوربور</title>
    
    <!-- Font Awesome -->
     <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../Vazirmatn-font-face.css">
        <link rel="icon" href="../image/iconB.png" />

    
    <style>
        @font-face {
            font-family: "Vazirmatn";
            src: url("../font/Vazirmatn-Medium.woff2") format("woff2");
            font-weight: 500;
        }
        @font-face {
            font-family: "Vazirmatn";
            src: url("../font/Vazirmatn-Regular.woff2") format("woff2");
            font-weight: 400;
        }
        @font-face {
            font-family: "Shabnam";
            src: url("../font/Shabnam-Bold.woff2") format("woff2");
            font-weight: 700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Vazirmatn", sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #202b59 50%, #172047 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .icon-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
            box-shadow: 0 10px 30px rgba(243, 156, 18, 0.4);
            animation: pulse 2s ease-in-out infinite;
            position: relative;
        }

        .icon-wrapper::before {
            content: '';
            position: absolute;
            width: 120%;
            height: 120%;
            border: 3px solid rgba(243, 156, 18, 0.3);
            border-radius: 50%;
            animation: ripple 2s ease-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(243, 156, 18, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 40px rgba(243, 156, 18, 0.6);
            }
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        .title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            font-family: "Shabnam", sans-serif;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            line-height: 1.7;
        }

        /* Alert Messages */
        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: flex;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.4);
            color: #e74c3c;
        }

        .alert i {
            font-size: 20px;
        }

        /* Form */
        .reset-form {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: #f39c12;
            font-size: 16px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px 20px;
            padding-right: 50px;
            padding-left: 50px;
            border-radius: 12px;
            font-size: 16px;
            font-family: "Vazirmatn", sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: #f39c12;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(243, 156, 18, 0.2);
        }

        .form-input.error {
            border-color: #e74c3c;
            animation: shake 0.4s ease;
        }

        .form-input.success {
            border-color: #10b981;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .input-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #f39c12;
            font-size: 18px;
            pointer-events: none;
        }

        .toggle-password {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-password:hover {
            color: #f39c12;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            animation: fadeInDown 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-message {
            color: #10b981;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            animation: fadeInDown 0.3s ease;
        }

        .success-message.show {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 15px;
            display: none;
        }

        .password-strength.show {
            display: block;
        }

        .strength-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .strength-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        .strength-weak {
            background: #e74c3c;
            width: 33%;
        }

        .strength-medium {
            background: #f39c12;
            width: 66%;
        }

        .strength-strong {
            background: #10b981;
            width: 100%;
        }

        .strength-text {
            font-size: 12px;
            margin-top: 5px;
            font-weight: 600;
        }

        .text-weak { color: #e74c3c; }
        .text-medium { color: #f39c12; }
        .text-strong { color: #10b981; }

        /* Password Requirements */
        .password-requirements {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .requirement-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .requirement-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .requirement-item i {
            font-size: 14px;
        }

        .requirement-item.valid {
            color: #10b981;
        }

        .requirement-item.valid i {
            color: #10b981;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-family: "Vazirmatn", sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(90deg, #f39c12, #e67e22);
            color: white;
            box-shadow: 0 5px 20px rgba(243, 156, 18, 0.4);
            margin-top: 30px;
        }

        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(90deg, #e67e22, #d35400);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(243, 156, 18, 0.6);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-submit i {
            font-size: 20px;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Back Link */
        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 40px 25px;
            }

            .title {
                font-size: 24px;
            }

            .icon-wrapper {
                width: 80px;
                height: 80px;
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Particles -->
    <div class="particle" style="width: 80px; height: 80px; left: 10%; animation-duration: 15s; animation-delay: 0s;"></div>
    <div class="particle" style="width: 60px; height: 60px; left: 80%; animation-duration: 12s; animation-delay: 2s;"></div>
    <div class="particle" style="width: 40px; height: 40px; left: 50%; animation-duration: 18s; animation-delay: 4s;"></div>
    <div class="particle" style="width: 50px; height: 50px; left: 30%; animation-duration: 20s; animation-delay: 1s;"></div>
    <div class="particle" style="width: 70px; height: 70px; left: 70%; animation-duration: 16s; animation-delay: 3s;"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon-wrapper">
                <i class="fas fa-key"></i>
            </div>
            <h1 class="title">تعیین رمز عبور جدید</h1>
            <p class="subtitle">
                لطفاً رمز عبور جدید خود را وارد کنید
            </p>
        </div>

        <!-- Alert Messages -->
        <div class="alert alert-error" id="alertError">
            <i class="fas fa-exclamation-circle"></i>
            <span id="alertErrorText"></span>
        </div>

        <div class="alert alert-success" id="alertSuccess">
            <i class="fas fa-check-circle"></i>
            <span id="alertSuccessText"></span>
        </div>

        <!-- Reset Form -->
        <form class="reset-form" id="resetForm">
            <!-- رمز عبور جدید -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-lock"></i>
                    رمز عبور جدید
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        class="form-input" 
                        id="newPassword" 
                        placeholder="رمز عبور جدید خود را وارد کنید"
                    >
                    <i class="fas fa-eye toggle-password" id="toggleNewPassword"></i>
                </div>
                <div class="error-message" id="newPasswordError"></div>
                <div class="success-message" id="newPasswordSuccess">
                    <i class="fas fa-check"></i>
                    <span>رمز عبور مناسب است</span>
                </div>

                <!-- Password Strength -->
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-label">قدرت رمز عبور:</div>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <div class="strength-text" id="strengthText"></div>
                </div>
            </div>

            <!-- تایید رمز عبور -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-lock"></i>
                    تایید رمز عبور جدید
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        class="form-input" 
                        id="confirmPassword" 
                        placeholder="رمز عبور را دوباره وارد کنید"
                    >
                    <i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
                </div>
                <div class="error-message" id="confirmPasswordError"></div>
                <div class="success-message" id="confirmPasswordSuccess">
                    <i class="fas fa-check"></i>
                    <span>رمزهای عبور مطابقت دارند</span>
                </div>
            </div>

            <!-- Password Requirements -->
            <div class="password-requirements">
                <div class="requirement-title">الزامات رمز عبور:</div>
                <div class="requirement-item" id="req-length">
                    <i class="far fa-circle"></i>
                    <span>حداقل ۸ کاراکتر</span>
                </div>
                <div class="requirement-item" id="req-uppercase">
                    <i class="far fa-circle"></i>
                    <span>حداقل یک حرف بزرگ انگلیسی</span>
                </div>
                <div class="requirement-item" id="req-lowercase">
                    <i class="far fa-circle"></i>
                    <span>حداقل یک حرف کوچک انگلیسی</span>
                </div>
                <div class="requirement-item" id="req-number">
                    <i class="far fa-circle"></i>
                    <span>حداقل یک عدد</span>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <div class="spinner"></div>
                <span class="btn-text">
                    <i class="fas fa-check-circle"></i>
                    تایید و تغییر رمز عبور
                </span>
            </button>
        </form>

        <!-- Back Link -->
        <div class="back-link">
            <a href="login.html">
                <i class="fas fa-arrow-right"></i>
                بازگشت به صفحه ورود
            </a>
        </div>
    </div>

    <script>
        // Elements
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const toggleNewPassword = document.getElementById('toggleNewPassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const resetForm = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertError = document.getElementById('alertError');
        const alertSuccess = document.getElementById('alertSuccess');
        const passwordStrength = document.getElementById('passwordStrength');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');

        // Block Persian/Arabic characters in password fields
        function blockPersianInput(e) {
            const persianRegex = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
            
            if (persianRegex.test(e.data)) {
                e.preventDefault();
                const input = e.target;
                input.value = input.value.replace(persianRegex, '');
                showAlert('error', 'لطفاً از کیبورد انگلیسی برای رمز عبور استفاده کنید');
            }
        }

        // Apply Persian blocking to password inputs
        newPasswordInput.addEventListener('beforeinput', blockPersianInput);
        confirmPasswordInput.addEventListener('beforeinput', blockPersianInput);

        // Also block on paste
        [newPasswordInput, confirmPasswordInput].forEach(input => {
            input.addEventListener('paste', (e) => {
                const pastedText = e.clipboardData.getData('text');
                const persianRegex = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
                
                if (persianRegex.test(pastedText)) {
                    e.preventDefault();
                    showAlert('error', 'نمی‌توانید متن فارسی را در فیلد رمز عبور وارد کنید');
                }
            });
        });

        // Toggle Password Visibility
        toggleNewPassword.addEventListener('click', () => {
            const type = newPasswordInput.type === 'password' ? 'text' : 'password';
            newPasswordInput.type = type;
            toggleNewPassword.classList.toggle('fa-eye');
            toggleNewPassword.classList.toggle('fa-eye-slash');
        });

        toggleConfirmPassword.addEventListener('click', () => {
            const type = confirmPasswordInput.type === 'password' ? 'text' : 'password';
            confirmPasswordInput.type = type;
            toggleConfirmPassword.classList.toggle('fa-eye');
            toggleConfirmPassword.classList.toggle('fa-eye-slash');
        });

        // Password Strength Check
        function checkPasswordStrength(password) {
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            return strength;
        }

        // Update Password Strength UI and Requirements
        newPasswordInput.addEventListener('input', () => {
            const password = newPasswordInput.value;

            if (password.length === 0) {
                passwordStrength.classList.remove('show');
                // Reset all requirements when password is empty
                updateRequirement('req-length', false);
                updateRequirement('req-uppercase', false);
                updateRequirement('req-lowercase', false);
                updateRequirement('req-number', false);
                return;
            }

            passwordStrength.classList.add('show');
            const strength = checkPasswordStrength(password);

            strengthFill.className = 'strength-fill';
            strengthText.className = 'strength-text';

            if (strength <= 2) {
                strengthFill.classList.add('strength-weak');
                strengthText.classList.add('text-weak');
                strengthText.textContent = 'ضعیف';
            } else if (strength <= 4) {
                strengthFill.classList.add('strength-medium');
                strengthText.classList.add('text-medium');
                strengthText.textContent = 'متوسط';
            } else {
                strengthFill.classList.add('strength-strong');
                strengthText.classList.add('text-strong');
                strengthText.textContent = 'قوی';
            }

            // Update requirements
            updateRequirement('req-length', password.length >= 8);
            updateRequirement('req-uppercase', /[A-Z]/.test(password));
            updateRequirement('req-lowercase', /[a-z]/.test(password));
            updateRequirement('req-number', /[0-9]/.test(password));

            // Validate
            validateNewPassword();
        });

        function updateRequirement(id, isValid) {
            const element = document.getElementById(id);
            if (isValid) {
                element.classList.add('valid');
                element.querySelector('i').className = 'fas fa-check-circle';
            } else {
                element.classList.remove('valid');
                element.querySelector('i').className = 'far fa-circle';
            }
        }

        // Real-time Validation
        newPasswordInput.addEventListener('blur', () => validateNewPassword());
        confirmPasswordInput.addEventListener('input', () => validateConfirmPassword());
        confirmPasswordInput.addEventListener('blur', () => validateConfirmPassword());

        // Validation Functions
        function validateNewPassword() {
            const value = newPasswordInput.value;
            const errorDiv = document.getElementById('newPasswordError');
            const successDiv = document.getElementById('newPasswordSuccess');

            if (!value) {
                showError(newPasswordInput, errorDiv, successDiv, 'لطفاً رمز عبور جدید را وارد کنید');
                return false;
            }

            if (value.length < 8) {
                showError(newPasswordInput, errorDiv, successDiv, 'رمز عبور باید حداقل ۸ کاراکتر باشد');
                return false;
            }

            if (!/[A-Z]/.test(value)) {
                showError(newPasswordInput, errorDiv, successDiv, 'رمز عبور باید شامل حداقل یک حرف بزرگ انگلیسی باشد');
                return false;
            }

            if (!/[a-z]/.test(value)) {
                showError(newPasswordInput, errorDiv, successDiv, 'رمز عبور باید شامل حداقل یک حرف کوچک انگلیسی باشد');
                return false;
            }

            if (!/[0-9]/.test(value)) {
                showError(newPasswordInput, errorDiv, successDiv, 'رمز عبور باید شامل حداقل یک عدد باشد');
                return false;
            }

            showSuccess(newPasswordInput, errorDiv, successDiv);
            return true;
        }

        function validateConfirmPassword() {
            const value = confirmPasswordInput.value;
            const newPassword = newPasswordInput.value;
            const errorDiv = document.getElementById('confirmPasswordError');
            const successDiv = document.getElementById('confirmPasswordSuccess');

            if (!value) {
                showError(confirmPasswordInput, errorDiv, successDiv, 'لطفاً رمز عبور را مجدداً وارد کنید');
                return false;
            }

            if (value !== newPassword) {
                showError(confirmPasswordInput, errorDiv, successDiv, 'رمزهای عبور مطابقت ندارند');
                return false;
            }

            showSuccess(confirmPasswordInput, errorDiv, successDiv);
            return true;
        }

        function showError(input, errorDiv, successDiv, message) {
            input.classList.add('error');
            input.classList.remove('success');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            successDiv.classList.remove('show');
        }

        function showSuccess(input, errorDiv, successDiv) {
            input.classList.remove('error');
            input.classList.add('success');
            errorDiv.classList.remove('show');
            successDiv.classList.add('show');
        }

        function showAlert(type, message) {
            const alert = type === 'success' ? alertSuccess : alertError;
            const text = type === 'success' ? document.getElementById('alertSuccessText') : document.getElementById('alertErrorText');
            
            // Hide both alerts first
            alertSuccess.classList.remove('show');
            alertError.classList.remove('show');
            
            // Show the appropriate alert
            text.textContent = message;
            alert.classList.add('show');

            // Auto hide after 5 seconds
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // Form Submit
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate both fields
            const isNewPasswordValid = validateNewPassword();
            const isConfirmPasswordValid = validateConfirmPassword();

            if (!isNewPasswordValid || !isConfirmPasswordValid) {
                showAlert('error', 'لطفاً تمام فیلدها را به درستی پر کنید');
                return;
            }

            // Show loading
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                console.log('Reset Password Data:', {
                    newPassword,
                    confirmPassword
                });

                // Simulate successful reset
                showAlert('success', 'رمز عبور با موفقیت تغییر کرد! در حال انتقال به صفحه ورود...');

                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            }, 1500);
        });
    </script>
</body>
</html>
