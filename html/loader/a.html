<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BorBor — Loading</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>

/* ═══════════════════════════════════════════
   BORBOR LOADER — loader.html
   نحوه استفاده در هر صفحه:
   ۱. این فایل را <link> یا <script src> نکنید
   ۲. کافیه همین فایل رو به عنوان صفحه لودینگ
      نمایش بدید یا محتوای داخلش رو کپی کنید
   ═══════════════════════════════════════════ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-main:   #0f1629;
  --accent:    #4a90d9;
  --accent2:   #8e5fd4;
  --accent3:   #06d6a0;
  --accent4:   #f39c12;
  --text:      #e8f0ff;
  --text-muted: rgba(180,200,255,0.45);
  --border:    rgba(255,255,255,0.07);
}

/* ── Full-page overlay ── */
#borbor-loader {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: var(--bg-main);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;

  /* fade-out class toggled by JS */
  opacity: 1;
  transition: opacity 0.55s ease;
}

#borbor-loader.hide {
  opacity: 0;
  pointer-events: none;
}

/* ── Atmosphere ── */
#borbor-loader::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 55% at 18% 10%, rgba(74,144,217,0.18) 0%, transparent 55%),
    radial-gradient(ellipse 55% 45% at 80% 85%, rgba(142,95,212,0.14) 0%, transparent 55%),
    radial-gradient(ellipse 40% 40% at 55% 50%, rgba(6,214,160,0.05) 0%, transparent 65%);
  pointer-events: none;
}

/* ── Grid noise ── */
.lb-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(74,144,217,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(74,144,217,0.04) 1px, transparent 1px);
  background-size: 38px 38px;
  pointer-events: none;
}

/* ── Particles ── */
.lb-particles {
  position: absolute; inset: 0;
  pointer-events: none; overflow: hidden;
}
.lb-particle {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
  animation: lb-particle-float linear infinite;
}
@keyframes lb-particle-float {
  0%   { opacity: 0;   transform: translateY(0)     scale(0.5); }
  20%  { opacity: 0.7; }
  80%  { opacity: 0.4; }
  100% { opacity: 0;   transform: translateY(-280px) scale(1.3); }
}

/* ── Core wrapper ── */
.lb-core {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; gap: 0;
}

/* ── Rings ── */
.lb-rings {
  position: relative;
  width: 150px; height: 150px;
  margin-bottom: 34px;
}
.lb-ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid transparent;
}
.lb-ring-1 {
  inset: 0;
  border-top-color: var(--accent);
  border-right-color: rgba(74,144,217,0.18);
  animation: lb-spin 1.4s linear infinite;
  box-shadow: 0 0 20px rgba(74,144,217,0.28);
}
.lb-ring-2 {
  inset: 17px;
  border-right-color: var(--accent2);
  border-bottom-color: rgba(142,95,212,0.22);
  animation: lb-spin 1.9s linear infinite reverse;
  box-shadow: 0 0 15px rgba(142,95,212,0.22);
}
.lb-ring-3 {
  inset: 34px;
  border-top-color: var(--accent3);
  border-left-color: rgba(6,214,160,0.18);
  animation: lb-spin 1.1s linear infinite;
  box-shadow: 0 0 11px rgba(6,214,160,0.2);
}
.lb-ring-center {
  position: absolute; inset: 50px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(74,144,217,0.2),
    rgba(142,95,212,0.12),
    transparent);
  animation: lb-pulse-c 2s ease-in-out infinite;
  display: flex; align-items: center; justify-content: center;
}
.lb-ring-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 14px rgba(74,144,217,0.8);
  animation: lb-pulse-dot 2s ease-in-out infinite;
}

@keyframes lb-spin      { to { transform: rotate(360deg); } }
@keyframes lb-pulse-c   { 0%,100%{opacity:.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.08)} }
@keyframes lb-pulse-dot { 0%,100%{box-shadow:0 0 8px rgba(74,144,217,.6)} 50%{box-shadow:0 0 22px rgba(74,144,217,1)} }

/* ── Brand ── */
.lb-brand-wrap {
  display: flex; flex-direction: column;
  align-items: center; gap: 7px;
}
.lb-brand {
  font-family: 'Orbitron', sans-serif;
  font-size: 40px; font-weight: 900;
  letter-spacing: 5px;
  color: #fff;
  animation: lb-fade-up 0.7s ease both;
}
.lb-brand .lb-hi {
  color: var(--accent);
  animation: lb-glow 2.5s ease-in-out infinite;
}
.lb-sub {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 5px;
  color: var(--text-muted);
  text-transform: uppercase;
  animation: lb-fade-up 0.9s 0.2s ease both;
}

@keyframes lb-fade-up {
  from { opacity:0; transform:translateY(12px) scale(.96); }
  to   { opacity:1; transform:translateY(0)    scale(1);   }
}
@keyframes lb-glow {
  0%,100% { text-shadow: 0 0 20px rgba(74,144,217,.5); }
  50%      { text-shadow: 0 0 40px rgba(74,144,217,1), 0 0 70px rgba(142,95,212,.5); }
}

/* ── Progress ── */
.lb-progress-wrap {
  margin-top: 30px;
  width: 210px;
  display: flex; flex-direction: column;
  align-items: center; gap: 9px;
}
.lb-bar {
  width: 100%; height: 3px;
  background: rgba(255,255,255,0.07);
  border-radius: 3px;
  overflow: hidden; position: relative;
}
.lb-bar-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  box-shadow: 0 0 12px rgba(74,144,217,0.65);
  animation: lb-progress 2.2s ease-in-out infinite;
  position: absolute; top: 0; left: 0;
}
@keyframes lb-progress {
  0%   { left:-40%; width:40%; }
  50%  { left: 40%; width:60%; }
  100% { left:110%; width:40%; }
}
.lb-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px; letter-spacing: 3px;
  color: var(--text-muted);
  animation: lb-blink 1.6s ease-in-out infinite;
}
@keyframes lb-blink { 0%,100%{opacity:.4} 50%{opacity:1} }

</style>
</head>
<body style="margin:0;background:#0f1629">

<!-- ════════════════ LOADER OVERLAY ════════════════ -->
<div id="borbor-loader">
  <div class="lb-grid"></div>
  <div class="lb-particles" id="lb-particles"></div>

  <div class="lb-core">
    <!-- Rings -->
    <div class="lb-rings">
      <div class="lb-ring lb-ring-1"></div>
      <div class="lb-ring lb-ring-2"></div>
      <div class="lb-ring lb-ring-3"></div>
      <div class="lb-ring-center">
        <div class="lb-ring-dot"></div>
      </div>
    </div>

    <!-- Brand -->
    <div class="lb-brand-wrap">
      <div class="lb-brand">BOR<span class="lb-hi">BOR</span></div>
      <div class="lb-sub">School Management System</div>
    </div>

    <!-- Progress -->
    <div class="lb-progress-wrap">
      <div class="lb-bar"><div class="lb-bar-fill"></div></div>
      <div class="lb-label">LOADING ...</div>
    </div>
  </div>
</div>
<!-- ═══════════════════════════════════════════════ -->

<script>
/* ── Generate particles ── */
(function(){
  const wrap   = document.getElementById('lb-particles');
  const colors = ['#4a90d9','#8e5fd4','#06d6a0','#f39c12','#e74c3c'];
  for(let i = 0; i < 22; i++){
    const p = document.createElement('div');
    p.className = 'lb-particle';
    const size = 2 + Math.random() * 3;
    p.style.cssText = `
      left:${Math.random()*100}%;
      bottom:-10px;
      width:${size}px;
      height:${size}px;
      background:${colors[i % colors.length]};
      animation-duration:${3.5 + Math.random()*4}s;
      animation-delay:${Math.random()*5}s;
    `;
    wrap.appendChild(p);
  }
})();

/* ════════════════════════════════════════
   نحوه استفاده در صفحات دیگر:
   ────────────────────────────────────────
   گزینه ۱ — hide بعد از لود صفحه:
     window.addEventListener('load', () => {
       document.getElementById('borbor-loader').classList.add('hide');
       setTimeout(() => {
         document.getElementById('borbor-loader').remove();
       }, 600);
     });

   گزینه ۲ — hide با تایمر مصنوعی:
     setTimeout(() => {
       document.getElementById('borbor-loader').classList.add('hide');
     }, 2000);
   ════════════════════════════════════════ */

/* نمونه: بعد از ۲.۵ ثانیه پنهان می‌شه (برای تست) */
setTimeout(() => {
  const loader = document.getElementById('borbor-loader');
  if(loader) {
    loader.classList.add('hide');
    setTimeout(() => loader.remove(), 600);
  }
}, 2500);
</script>

</body>
</html>
