<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوربور - دسترسی ندارید</title>
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../Vazirmatn-font-face.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0f1b3d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Vazirmatn, Tahoma, sans-serif;
      color: #c8d8f0;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 60px 50px;
      text-align: center;
      max-width: 480px;
      width: 90%;
    }
    .icon-wrap {
      width: 90px; height: 90px;
      background: linear-gradient(135deg, #fa709a, #fee140);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
      font-size: 38px; color: #fff;
    }
    h1 { font-size: 26px; margin-bottom: 12px; color: #fff; }
    p  { font-size: 15px; color: #8aa0c0; line-height: 1.8; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: linear-gradient(135deg, #4da3ff, #667eea);
      color: #fff; border-radius: 10px;
      text-decoration: none; font-size: 15px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn i { margin-left: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap"><i class="fas fa-lock"></i></div>
    <h1>دسترسی ندارید</h1>
    <p>شما مجاز به مشاهده این صفحه نیستید.<br/>در صورت نیاز با مدیر سیستم تماس بگیرید.</p>
    <a href="../html/dashbord.html" class="btn"><i class="fas fa-arrow-right"></i> بازگشت به داشبورد</a>
  </div>
</body>
</html>
